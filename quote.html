<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote</title>
</head>
<body style="font-family: 'Arial', sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333;">

      <!-- Search Bar and Contact Info Header -->
  <header class="top-header" style="display: flex; justify-content: space-between; background-color: #c8ced3; color: white; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);">
    <div class="search-bar">
      <input type="text" placeholder="Search" style="padding: 10px; border-radius: 20px; border: none; width: 200px; transition: background-color 0.3s;">
    </div>
    <div class="contact-info">
      <p style="margin: 0; font-size: 14px;">+92 31444321638 | hazixsolution@gmail.com</p>
    </div>
  </header>

   <!-- Logo and Menu Header -->
   <header style="display: flex; justify-content: space-between; align-items: center; background-color: #f5f8fa; padding: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); position: sticky; top: 0; z-index: 1000;">
    <div class="logo">
      <img src="logo.png" alt="Hazix Logo" style="height: 100px;"> <!-- Logo size adjusted -->
    </div>
    <nav>
      <ul style="list-style: none; display: flex; margin: 0; padding: 0;">
        <li style="margin-right: 30px;">
          <a href="home.html" style="color: rgb(10, 35, 223); text-decoration: none; font-weight: 500; transition: color 0.3s; font-size: 1em;">Home</a>
        </li>
        <li style="margin-right: 30px;">
          <a href="signup.html" style="color: rgb(10, 35, 223); text-decoration: none; font-weight: 500; transition: color 0.3s; font-size: 1em;">Sign Up</a>
        </li>
        <li style="margin-right: 30px;">
          <a href="services.html" style="color: rgb(10, 35, 223); text-decoration: none; font-weight: 500; transition: color 0.3s; font-size: 1em;">Services</a>
        </li>
        <li style="margin-right: 30px;">
          <a href="porfolio.html" style="color: rgb(10, 35, 223); text-decoration: none; font-weight: 500; transition: color 0.3s; font-size: 1em;">Portfolio</a>
        </li>
        <li style="margin-right: 30px;">
          <a href="about.html" style="color: rgb(10, 35, 223); text-decoration: none; font-weight: 500; transition: color 0.3s; font-size: 1em;">About</a>
        </li>
        <li style="margin-right: 30px;">
          <a href="blog.html" style="color: rgb(10, 35, 223); text-decoration: none; font-weight: 500; transition: color 0.3s; font-size: 1em;">Blog</a>
        </li>
        <li style="margin-right: 30px;">
          <a href="contact.html" style="color: rgb(10, 35, 223); text-decoration: none; font-weight: 500; transition: color 0.3s; font-size: 1em;">Contact</a>
        </li>
        <li>
          <a href="quote.html" style="color: rgb(10, 35, 223); background-color: #a293d33d; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: bold; transition: background-color 0.3s;">GET A QUOTE</a>
        </li>
      </ul>
    </nav>
  </header>

    <!-- Main Section -->
    <section style="padding: 40px 20px; max-width: 800px; margin: 60px auto 40px; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);">
        <h2 style="color: #2980b9; text-align: center; margin-bottom: 40px; font-size: 2.5em; font-weight: bold;">Get a Quote</h2>

        <form action="#" method="POST" style="margin: 0; padding: 0;">
            <!-- Name Input -->
            <div style="margin-bottom: 20px;">
                <label for="name" style="display: block; font-size: 1.1em; color: #333; margin-bottom: 8px; font-weight: bold;">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; box-sizing: border-box;">
            </div>

            <!-- Email Input -->
            <div style="margin-bottom: 20px;">
                <label for="email" style="display: block; font-size: 1.1em; color: #333; margin-bottom: 8px; font-weight: bold;">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Your Email" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; box-sizing: border-box;">
            </div>

            <!-- Service Type Dropdown -->
            <div style="margin-bottom: 20px;">
                <label for="service" style="display: block; font-size: 1.1em; color: #333; margin-bottom: 8px; font-weight: bold;">Service Type</label>
                <select id="service" name="service" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; box-sizing: border-box;">
                    <option value="web-design">Website Design</option>
                    <option value="graphic-design">Graphic Design</option>
                    <option value="social-media">Social Media Marketing</option>
                    <option value="seo">SEO Services</option>
                </select>
            </div>

            <!-- Message Input -->
            <div style="margin-bottom: 20px;">
                <label for="message" style="display: block; font-size: 1.1em; color: #333; margin-bottom: 8px; font-weight: bold;">Message</label>
                <textarea id="message" name="message" placeholder="Tell us about your project..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; height: 100px; box-sizing: border-box;"></textarea>
            </div>

            <!-- Submit Button -->
            <div style="text-align: center;">
                <button type="submit" style="background-color: #2980b9; color: white; padding: 12px 25px; border: none; border-radius: 30px; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: background-color 0.3s; border: 1px solid #2980b9;">Submit</button>
            </div>
        </form>
    </section>

    <!-- Footer Section -->
    <footer style="background-color: #333; color: #fff; padding: 40px 0; text-align: center; margin-top: 40px;">
        <p style="margin: 0; font-size: 1em;">&copy; Hazix Solution. All Rights Reserved.</p>
    </footer>

</body>
</html>
